<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>PETSCII Tarot</title>
<link rel="icon" type="image/png" href="/fav/favicon-96x96.png?v=20260827" sizes="96x96" />
<link rel="icon" type="image/svg+xml" href="/fav/favicon.svg?v=20260827" />
<link rel="shortcut icon" href="/fav/favicon.ico?v=20260827" />
<link rel="apple-touch-icon" sizes="180x180" href="/fav/apple-touch-icon.png?v=20260827" />
<meta name="apple-mobile-web-app-title" content="PETSCII Tarot" />
<link rel="manifest" href="/fav/site.webmanifest?v=20260827" />
<style>
  @font-face {
    font-family: 'C64 Pro';
    src: local('C64 Pro'), local('C64 Pro Mono');
    src: url('fonts/C64_Pro_Mono-STYLE.woff2') format('woff2');
  }
  html, body { margin: 0; background: #000; height: 100%; }
  #table {
    position: relative;
    width: 100%;
    min-height: 100vh;
    background-color: #000;
    background-image:
      linear-gradient(to right, rgba(255,255,255,0.07) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(255,255,255,0.07) 1px, transparent 1px);
    overflow: hidden;
  }
  #scaleControl {
    position: absolute;
    left: 0;
    right: 0;
    z-index: 60;
    display: flex;
    justify-content: center;
    align-items: center;
  }
  #scaleControl .card-pre { cursor: default; }
  #scaleControl .btn { cursor: pointer; }
  #deckArea {
    position: absolute;
    z-index: 50; /* must stay BELOW placed-card z-indices (start at 100+) */
  }
  #deckStack {
    position: relative;
    touch-action: none;
  }
  #deckCount {
    display: flex;
    justify-content: flex-start;
  }
  #shuffleBtn {
    cursor: pointer;
    display: inline-block;
  }
  #shuffleBtn:hover .card-pre { opacity: 0.85; }
  #settingsPanel .card-pre[style*="cursor: pointer"]:hover { opacity: 0.85; }
  .card-pre {
    margin: 0;
    font-family: 'C64 Pro', 'C64 Pro Mono', monospace;
  }
  .card-row { white-space: pre; }
  .card-wrap {
    position: absolute;
    touch-action: none;
    cursor: grab;
  }
  .card-visual { pointer-events: none; display: flex; justify-content: center; }
  .card-tip { pointer-events: none; }
</style>
</head>
<body>

<div id="table">
  <div id="scaleControl"></div>
  <div id="deckArea">
    <div id="deckStack"></div>
    <div id="deckCount"></div>
    <div id="shuffleBtn"></div>
    <div id="settingsPanel"></div>
  </div>
</div>

<script type="module" src="scripts/ui.js"></script>
</body>
</html>
